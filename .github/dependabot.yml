version: 2
updates:
  # Automatic updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    groups:
      all-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    assignees:
      - "dyoshikawa"
    allow:
      - dependency-type: "all"
    ignore:
      # Pinned to a 2.0 beta (the only line without wrangler that writes the
      # Build Output `cf deploy` reads). A beta can change the Build Output or
      # the config API and must bundle the same @cloudflare/config as `cf`, so
      # it is bumped by hand together with `cf` (check `pnpm cf:dry-run` and
      # the browser tests). Drop this once 2.0 is stable.
      - dependency-name: "@cloudflare/vite-plugin"

  # Automatic updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci"
      - "automated"
    assignees:
      - "dyoshikawa"

  # Automatic updates for the devcontainer base image
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 1
    groups:
      all-docker:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    assignees:
      - "dyoshikawa"
