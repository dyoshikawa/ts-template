version: 2
updates:
  # Automatic updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    groups:
      all-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    assignees:
      - "dyoshikawa"
    allow:
      - dependency-type: "all"
    ignore:
      # 1.65.0 dropped the support for cf's `cloudflare.config.ts` and its
      # Build Output, which `pnpm cf:dry-run` needs; upstream points to the
      # v2 plugin (beta) instead. Drop this once the template moves to v2.
      - dependency-name: "@cloudflare/vite-plugin"
        versions: [">=1.65.0"]

  # Automatic updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci"
      - "automated"
    assignees:
      - "dyoshikawa"

  # Automatic updates for the devcontainer base image
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 1
    groups:
      all-docker:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    assignees:
      - "dyoshikawa"
