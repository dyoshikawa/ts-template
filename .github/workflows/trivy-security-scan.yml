name: Trivy Security Scan

on:
  push:
    branches: [main]
    paths: &paths
      - ".devcontainer/Dockerfile"
      - ".github/workflows/trivy-security-scan.yml"
      - ".trivyignore"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  trivy-config-scan:
    name: Trivy Config Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # Only the devcontainer Dockerfile is scanned: Trivy's misconfig scanners
      # cover Dockerfile/Kubernetes/Terraform/CloudFormation/Helm/Ansible/Azure
      # ARM, but not GitHub Actions workflows — pointing it at `.github/workflows`
      # detects zero config files. actionlint and pinact cover the workflows.
      - name: Run Trivy for Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: "config"
          scan-ref: ".devcontainer"
          scanners: "misconfig"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "table"
          trivyignores: ".trivyignore"
