name: Deploy

# Ships main to production: the D1 migrations first, then the Worker (SSR
# handler and client assets). Deploys queue behind one another rather than
# racing.
#
# Run by hand (`workflow_dispatch`) until the app is set up (README: "Deploy
# to Cloudflare"). To deploy every push to main, add:
#
#   push:
#     branches: [main]
#     paths-ignore: ["docs/**", "LICENSE", "**/*.md", ".rulesync/**", ".claude/**", "e2e/**", ".github/**"]
on:
  workflow_dispatch:

permissions:
  contents: read # Required for checking out code

# A cache download that stalls (a DNS failure on the runner left one hanging)
# gives up after a minute instead of the toolkit's default ten; the job then
# goes on without the cache.
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      # An API token from the "Edit Cloudflare Workers" template (Workers
      # Scripts, Workers Routes on the zone) plus Account → D1 → Edit, and the
      # account it deploys to.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # The checks a commit passes before it is pushed; a push that fails them
      # is not shipped, whatever the CI workflow running beside this one says.
      - name: Run code checks
        run: pnpm cicheck:code

      # The schema before the code that reads it: a migration that is already
      # applied is skipped, so this is safe to run on every push.
      - name: Apply D1 migrations
        run: pnpm run db:migrate:remote

      - name: Build and deploy the Worker
        run: pnpm run deploy
