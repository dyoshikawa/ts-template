# yaml-language-server: $schema=https://json.schemastore.org/pnpm-workspace.json
# Postinstall scripts stay blocked by default; add packages here only when a
# build step is genuinely required.
allowBuilds:
  "@ast-grep/lang-go": false
  "@ast-grep/lang-rust": false
  "@prisma/client": false
  better-sqlite3: false
  esbuild: false
  tldjs: false
  workerd: false
ignoreScripts: false
# Refuse dependency versions published less than a day ago, so a compromised
# release has time to be pulled before it lands in a lockfile.
minimumReleaseAge: 1440 # 1 day
# Transitive fixes for advisories in versions rulesync@16 pins (dev only);
# drop them once rulesync is upgraded past those pins.
overrides:
  "@modelcontextprotocol/sdk@<1.31.0": 1.31.0
  smol-toml@<1.9.0: 1.9.1
  # Every package that asks for `vite` or `vitest` gets the copies Vite+ ships.
  vite@*: "catalog:"
  vitest@*: "catalog:"
# Vite+ (`vp`) and the tools it drives. `vite` is Vite+'s core under the
# upstream name, so plugins that import `vite` keep working.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5
  # `vp` resolves oxfmt and oxlint from the working directory before its own
  # copies, so a checkout nested in another project would otherwise run that
  # project's formatter and linter. Keep these at the versions vite-plus
  # bundles (its dist/toolchain.json).
  oxfmt: 0.74.0
  oxlint: 1.89.0
# Plugins declare peer ranges on upstream vite/vitest; the aliased copies satisfy them.
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
